<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The page is already dark: stop browser night modes (Brave/Dark Reader)
     from recolouring it, which turned the white swatch black. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<title>Deutsch Flashcards</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="floating-controls" class="hidden">
  <button id="autohide-toggle" class="floating-btn secondary">auto-hide: off</button>
  <button id="reset-btn" class="floating-btn">&#8635; hide all</button>
</div>

<div class="wrap">
  <header class="app-header">
    <h1>Deutsch<span>Flashcards</span></h1>
    <button id="reports-toggle" class="cat-btn">&#9873; reported <span id="reports-count">0</span></button>
  </header>

  <section id="reports-panel" class="hidden">
    <div class="reports-head">
      <strong>Reported pictures</strong>
      <div class="reports-actions">
        <button id="export-json" class="cat-btn">export JSON</button>
        <button id="export-csv" class="cat-btn">export CSV</button>
        <button id="reports-clear" class="cat-btn danger">clear all</button>
      </div>
    </div>
    <ul id="reports-list"></ul>
  </section>

  <div id="category-bar"></div>

  <div class="mode-row">
    <button id="quiz-toggle" class="cat-btn">&#129504; quiz mode</button>
  </div>

  <div id="deck">
    <div class="hint">click a card to hear it</div>
    <div id="grid"></div>

    <div class="nav-row">
      <button id="prev-btn">&larr; prev</button>
      <span id="progress-label"></span>
      <button id="next-btn">next &rarr;</button>
    </div>
  </div>
</div>

<script src="static/words.js"></script>
<script src="static/frequency.js"></script>
<script src="static/app.js"></script>
</body>
</html>
